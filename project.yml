# Xcodegen 示例配置（带注释）
# 说明：所有 `{...}` 占位符必须替换为项目实际值
# 路径说明：`healthsulingfengqmpgn` 为项目根目录下的源码目录名；`healthsulingfengqmpgn/Info.plist` 为相对项目根目录的文件路径（建议直接用 `healthsulingfengqmpgn/Info.plist`）
name: healthsulingfengqmpgn # 工程名称

options:
  bundleIdPrefix: com.silverdawn.frostyhill # Bundle ID 前缀，最终与 PRODUCT_BUNDLE_IDENTIFIER 组合
  deploymentTarget:
    iOS: "16.0" # 最低系统版本
  xcodeVersion: "15.0" # 建议使用的 Xcode 版本
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.silverdawn.frostyhill.myst # 应用 Bundle ID（可用 com.silverdawn.frostyhill.myst 模板）
    VERSIONING_SYSTEM: "apple-generic" # 版本控制系统
    INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)" # 构建版本写入 Info.plist
    CURRENT_PROJECT_VERSION: "1" # 构建号
    MARKETING_VERSION: "1.0.0" # 版本号
    SWIFT_VERSION: "5.9" # Swift 版本
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon" # AppIcon 资产组名称

# Target 定义
# 可以按需添加多个 targets

targets:
  healthsulingfengqmpgn:
    type: application # target 类型
    platform: iOS # 平台
    sources:
      - path: healthsulingfengqmpgn # 源码目录
        excludes:
          - "**/.DS_Store" # 排除系统文件
    settings:
      base:
        INFOPLIST_FILE: healthsulingfengqmpgn/Info.plist # Info.plist 路径
        PRODUCT_NAME: "$(TARGET_NAME)" # 产品名称
        TARGETED_DEVICE_FAMILY: "1" # 设备支持：1=iPhone，2=iPad
    info:
      path: healthsulingfengqmpgn/Info.plist # Info.plist 路径（与上面保持一致）
      properties:
        CFBundleDisplayName: "心率检测助手"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchScreenBackground # 启动屏背景色资产
        UIUserInterfaceStyle: Light # 强制浅色模式
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait # iPhone 竖屏
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # 允许非 HTTPS（必须）
